<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a100d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardDarkEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1f242c" />
    </linearGradient>
    <filter id="shadowDarkInit" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="360" rx="12" fill="url(#bgDarkEmerald)" stroke="#374151" stroke-width="1.2" />

  <!-- Header -->
  <text x="460" y="36" fill="#f3f4f6" font-size="16" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">init // Project Onboarding &amp; Existing Session Survey Workflow</text>
  <line x1="30" y1="52" x2="890" y2="52" stroke="#1f2937" stroke-width="1" />

  <!-- Flow Nodes -->
  <!-- Node 1: Project Onboarding -->
  <g transform="translate(30, 70)" filter="url(#shadowDarkInit)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkEmerald)" stroke="#2ea043" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-width="0.8" />
    <text x="24" y="28" fill="#56d364" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">01</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">新项目接入</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">项目首次引入 Plugin</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">存在大量异构历史会话</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#56d364" font-size="9" font-family="monospace">policy: zero-pollution</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">不修改用户业务源码</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">不污染 AGENTS.md</text>
  </g>

  <!-- Connector -->
  <path d="M 190 165 L 210 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 2: Read-only Discovery -->
  <g transform="translate(210, 70)" filter="url(#shadowDarkInit)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkEmerald)" stroke="#388bfd" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="0.8" />
    <text x="24" y="28" fill="#79c0ff" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">02</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">历史会话扫描</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">跨厂商只读安全发现</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">AGY / Codex / Claude</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#79c0ff" font-size="9" font-family="monospace">scan: read-only</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">提取 UUID &amp; 交互记录</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">建立元数据索引</text>
  </g>

  <!-- Connector -->
  <path d="M 370 165 L 390 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 3: Heuristic Inference -->
  <g transform="translate(390, 70)" filter="url(#shadowDarkInit)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkEmerald)" stroke="#d29922" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#d29922" fill-opacity="0.2" stroke="#e3b341" stroke-width="0.8" />
    <text x="24" y="28" fill="#e3b341" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">03</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">启发式映射生成</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">关键词与意图智能推断</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">生成标准化专题名称</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#e3b341" font-size="9" font-family="monospace">suggest: module_key</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">规划 memory_doc 路径</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">标记主会话候选</text>
  </g>

  <!-- Connector -->
  <path d="M 550 165 L 570 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 4: Dry-Run Preview -->
  <g transform="translate(570, 70)" filter="url(#shadowDarkInit)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkEmerald)" stroke="#8957e5" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#8957e5" fill-opacity="0.2" stroke="#a371f7" stroke-width="0.8" />
    <text x="24" y="28" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">04</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">用户预览与确认</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">--dry-run 结构化呈现</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">ID / 命名 / 专题对照</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#d2a8ff" font-size="9" font-family="monospace">mode: preview</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">支持用户人工裁决修改</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">确认后执行落盘</text>
  </g>

  <!-- Connector -->
  <path d="M 730 165 L 750 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 5: Persistence & Fallback -->
  <g transform="translate(750, 70)" filter="url(#shadowDarkInit)">
    <rect width="140" height="190" rx="8" fill="url(#cardDarkEmerald)" stroke="#f778ba" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#f778ba" fill-opacity="0.2" stroke="#ff7b72" stroke-width="0.8" />
    <text x="24" y="28" fill="#ff7b72" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">05</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">落盘与底层兜底</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">写入 sessions.json</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">告知绝对物理存储路径</text>
    <line x1="12" y1="110" x2="128" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#ff7b72" font-size="9" font-family="monospace">fallback: manual</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">支持随时直接改底层</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">插件实时热加载生效</text>
  </g>

  <!-- Bottom Spec Bar -->
  <rect x="30" y="280" width="860" height="48" rx="6" fill="#111827" stroke="#374151" />
  <text x="45" y="302" fill="#9ca3af" font-size="11" font-family="monospace">Command: node scripts/init_task_loop.js --dry-run | Target: .agents/task-loop/sessions.json</text>
  <text x="45" y="318" fill="#6b7280" font-size="10" font-family="sans-serif">无侵入历史会话梳理 | 支持用户直接手动修改底层 JSON 状态机</text>
</svg>
