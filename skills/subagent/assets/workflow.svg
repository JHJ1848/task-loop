<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardDarkCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter id="shadowDark" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="360" rx="12" fill="url(#bgDarkCarbon)" stroke="#374151" stroke-width="1.2" />

  <!-- Header -->
  <text x="460" y="36" fill="#f3f4f6" font-size="16" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">subagent // Native Subagent Orchestration &amp; Isolation Lifecycle</text>
  <line x1="30" y1="52" x2="890" y2="52" stroke="#1f2937" stroke-width="1" />

  <!-- Flow Nodes -->
  <!-- Node 1: Task Decomposition -->
  <g transform="translate(30, 70)" filter="url(#shadowDark)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkCarbon)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <text x="24" y="28" fill="#7dd3fc" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">01</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">任务定界与拆解</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">多代理并行需求规划</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">非重叠修改范围划定</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#38bdf8" font-size="9" font-family="monospace">trigger: Level 3</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">复杂多步/高风险探测</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">分配独立职责</text>
  </g>

  <!-- Connector -->
  <path d="M 190 165 L 210 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 2: Dynamic Templates -->
  <g transform="translate(210, 70)" filter="url(#shadowDark)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkCarbon)" stroke="#818cf8" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#4f46e5" fill-opacity="0.2" stroke="#818cf8" stroke-width="0.8" />
    <text x="24" y="28" fill="#c7d2fe" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">02</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">动态模板与声明</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">define_subagent 声明</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">invoke_subagent 派发</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#a5b4fc" font-size="9" font-family="monospace">SubagentConfig</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">工具与模型级别注入</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">专职角色定制</text>
  </g>

  <!-- Connector -->
  <path d="M 370 165 L 390 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 3: Workspace Isolation -->
  <g transform="translate(390, 70)" filter="url(#shadowDark)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkCarbon)" stroke="#a855f7" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#7e22ce" fill-opacity="0.2" stroke="#c084fc" stroke-width="0.8" />
    <text x="24" y="28" fill="#e9d5ff" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">03</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">工作区物理隔离</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="monospace">inherit // 共享工作区</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="monospace">branch  // 克隆物理沙箱</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#c084fc" font-size="9" font-family="monospace">share   // Worktree 隔离</text>
    <text x="12" y="150" fill="#f85149" font-size="9" font-family="sans-serif">杜绝写操作冲突</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">保障源码绝对安全</text>
  </g>

  <!-- Connector -->
  <path d="M 550 165 L 570 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 4: Reactive Wakeup -->
  <g transform="translate(570, 70)" filter="url(#shadowDark)">
    <rect width="155" height="190" rx="8" fill="url(#cardDarkCarbon)" stroke="#10b981" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#047857" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8" />
    <text x="24" y="28" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">04</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">被动唤醒异步执行</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">Reactive Wakeup</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">严禁死循环轮询</text>
    <line x1="12" y1="110" x2="143" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#34d399" font-size="9" font-family="monospace">event: message</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">自动接收完成通知</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">零 Token 挂机等待</text>
  </g>

  <!-- Connector -->
  <path d="M 730 165 L 750 165" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Node 5: Lifecycle Cleanup -->
  <g transform="translate(750, 70)" filter="url(#shadowDark)">
    <rect width="140" height="190" rx="8" fill="url(#cardDarkCarbon)" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="12" y="14" width="24" height="20" rx="4" fill="#b45309" fill-opacity="0.2" stroke="#fbbf24" stroke-width="0.8" />
    <text x="24" y="28" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">05</text>
    <text x="12" y="54" fill="#f3f4f6" font-size="13" font-weight="600" font-family="sans-serif">交付汇聚与回收</text>
    <text x="12" y="74" fill="#9ca3af" font-size="10" font-family="sans-serif">汇总 Subagent 交付</text>
    <text x="12" y="92" fill="#9ca3af" font-size="10" font-family="sans-serif">manage_agents(kill)</text>
    <line x1="12" y1="110" x2="128" y2="110" stroke="#374151" stroke-width="0.8" />
    <text x="12" y="132" fill="#fbbf24" font-size="9" font-family="monospace">clean: immediate</text>
    <text x="12" y="150" fill="#9ca3af" font-size="9" font-family="sans-serif">即时释放沙箱资源</text>
    <text x="12" y="168" fill="#e5e7eb" font-size="9" font-family="sans-serif">沉淀受控记忆</text>
  </g>

  <!-- Bottom Spec Bar -->
  <rect x="30" y="280" width="860" height="48" rx="6" fill="#111827" stroke="#374151" />
  <text x="45" y="302" fill="#9ca3af" font-size="11" font-family="monospace">Primitives: invoke_subagent | define_subagent | manage_subagents | send_message</text>
  <text x="45" y="318" fill="#6b7280" font-size="10" font-family="sans-serif">严禁主进程死循环轮询 | 临时代理用毕必须即刻调用 kill 释放</text>
</svg>
