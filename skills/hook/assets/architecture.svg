<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGraphite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2128" />
    </linearGradient>
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="380" rx="12" fill="url(#bgGraphite)" stroke="#30363d" stroke-width="1.2" />

  <!-- Header -->
  <text x="460" y="36" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">hook // Lifecycle Interceptor &amp; Allowlist Safety Gate</text>
  <line x1="30" y1="52" x2="890" y2="52" stroke="#21262d" stroke-width="1" />

  <!-- Left: PreInvocation -->
  <g transform="translate(30, 65)" filter="url(#panelShadow)">
    <rect width="420" height="285" rx="8" fill="url(#panelDark)" stroke="#388bfd" stroke-width="1.2" />
    <rect x="0" y="0" width="420" height="36" rx="8" fill="#1f6feb" fill-opacity="0.12" />
    <text x="18" y="24" fill="#58a6ff" font-size="13" font-weight="bold" font-family="monospace">[PreInvocation] Context Introspection</text>

    <!-- Substep 1 -->
    <rect x="16" y="48" width="388" height="46" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="28" y="68" fill="#f0f6fc" font-size="11" font-weight="600" font-family="sans-serif">1. 会话反向内省 (Session Introspection)</text>
    <text x="28" y="84" fill="#8b949e" font-size="10" font-family="monospace">stdin -> extract conversationId &amp; environment</text>

    <!-- Connector -->
    <path d="M 210 94 L 210 108" stroke="#388bfd" stroke-width="1.5" />

    <!-- Substep 2 -->
    <rect x="16" y="108" width="388" height="54" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="28" y="128" fill="#f0f6fc" font-size="11" font-weight="600" font-family="sans-serif">2. 专题属性匹配与命名空间隔离</text>
    <text x="28" y="144" fill="#8b949e" font-size="10" font-family="monospace">match module_key in .agents/task-loop/sessions.json</text>
    <text x="28" y="156" fill="#79c0ff" font-size="9" font-family="monospace">isolate [Plugin: task-loop] &amp; [Global Rules]</text>

    <!-- Connector -->
    <path d="M 210 162 L 210 176" stroke="#388bfd" stroke-width="1.5" />

    <!-- Substep 3 -->
    <rect x="16" y="176" width="388" height="52" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="28" y="196" fill="#f0f6fc" font-size="11" font-weight="600" font-family="sans-serif">3. 瞬态注入执行 (Ephemeral Injection)</text>
    <text x="28" y="214" fill="#56d364" font-size="10" font-weight="bold" font-family="monospace">stdout -> { ephemeralMessage: "..." }</text>

    <!-- Bottom Benefit -->
    <rect x="16" y="240" width="388" height="30" rx="4" fill="#161b22" stroke="#21262d" />
    <text x="210" y="260" fill="#8b949e" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Zero File Pollution // 零历史气泡与文件污染</text>
  </g>

  <!-- Right: PreToolUse -->
  <g transform="translate(470, 65)" filter="url(#panelShadow)">
    <rect width="420" height="285" rx="8" fill="url(#panelDark)" stroke="#f85149" stroke-width="1.2" />
    <rect x="0" y="0" width="420" height="36" rx="8" fill="#da3633" fill-opacity="0.12" />
    <text x="18" y="24" fill="#ff7b72" font-size="13" font-weight="bold" font-family="monospace">[PreToolUse] Physical Allowlist Gate</text>

    <!-- Substep 1 -->
    <rect x="16" y="48" width="388" height="46" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="28" y="68" fill="#f0f6fc" font-size="11" font-weight="600" font-family="sans-serif">1. 工具调用硬拦截 (Tool Intercept)</text>
    <text x="28" y="84" fill="#8b949e" font-size="10" font-family="monospace">write_to_file / replace_file_content / run_command</text>

    <!-- Connector -->
    <path d="M 210 94 L 210 108" stroke="#f85149" stroke-width="1.5" />

    <!-- Substep 2 -->
    <rect x="16" y="108" width="388" height="54" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="28" y="128" fill="#f0f6fc" font-size="11" font-weight="600" font-family="sans-serif">2. 物理白名单匹配 (Allowlist Matching)</text>
    <text x="28" y="144" fill="#8b949e" font-size="10" font-family="monospace">normalizeTarget(path) vs task.allowlist</text>
    <text x="28" y="156" fill="#ff7b72" font-size="9" font-family="monospace">enforce surgical boundary // 跨平台路径归一化</text>

    <!-- Connector -->
    <path d="M 210 162 L 210 176" stroke="#f85149" stroke-width="1.5" />

    <!-- Decision Nodes -->
    <g transform="translate(16, 176)">
      <rect x="0" y="0" width="188" height="52" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1" />
      <text x="94" y="22" fill="#56d364" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">IN ALLOWLIST</text>
      <text x="94" y="40" fill="#8b949e" font-size="10" text-anchor="middle" font-family="monospace">{ decision: "allow" }</text>

      <rect x="200" y="0" width="188" height="52" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1" />
      <text x="294" y="22" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">OUT OF SCOPE</text>
      <text x="294" y="40" fill="#f85149" font-size="10" text-anchor="middle" font-family="monospace">{ decision: "deny" }</text>
    </g>

    <!-- Bottom Benefit -->
    <rect x="16" y="240" width="388" height="30" rx="4" fill="#161b22" stroke="#21262d" />
    <text x="210" y="260" fill="#8b949e" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Physical Isolation // 彻底阻断破坏性越权修改</text>
  </g>
</svg>
